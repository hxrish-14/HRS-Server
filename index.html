<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vault</title>
<meta name="description" content="Private file-link vault." />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============================= LOGIN VIEW ============================= -->
<main id="view-login" class="view view-login">
  <div class="login-card">
    <div class="login-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 11V8a8 8 0 0 1 16 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="3" y="11" width="18" height="10" rx="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="16" r="1.6" fill="currentColor"/></svg>
    </div>
    <h1 class="login-title">Vault</h1>
    <p class="login-sub">Two factors. No exceptions.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="f-email">Email</label>
        <input id="f-email" name="email" type="email" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="f-password">Password</label>
        <div class="field-with-toggle">
          <input id="f-password" name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Show password" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="f-timecode">Current-time password</label>
        <div class="field-with-toggle">
          <input id="f-timecode" name="timeCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code" required />
          <button type="button" class="toggle-visibility" id="toggle-timecode" aria-label="Show current-time password" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
        <p class="field-hint">8 digits, issued from your own time-code source.</p>
      </div>

      <div id="login-error" class="login-error" role="alert" hidden></div>

      <button type="submit" id="login-submit" class="btn-primary btn-block">
        <span class="btn-label">Log in</span>
        <span class="btn-spinner" hidden aria-hidden="true"></span>
      </button>
    </form>
  </div>
</main>

<!-- ============================== APP VIEW =============================== -->
<div id="view-app" class="view view-app" hidden>

  <header class="app-header" id="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 11V8a8 8 0 0 1 16 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="11" width="18" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="16" r="1.6" fill="currentColor"/></svg>
        </span>
        <span>Vault</span>
      </div>

      <nav class="header-nav" aria-label="Primary">
        <button class="nav-link is-active" data-view="files" type="button">Files</button>
        <button class="nav-link" data-view="admin" id="nav-admin" type="button" hidden>Admin</button>
        <span class="nav-indicator" aria-hidden="true"></span>
      </nav>

      <div class="header-user">
        <div class="user-chip">
          <span id="user-name">—</span>
          <span id="user-role" class="role-pill">—</span>
        </div>
        <button id="btn-logout" class="btn-ghost" type="button">Log out</button>
      </div>
    </div>
  </header>

  <!-- ---- Files screen ---- -->
  <section class="screen" id="screen-files">
    <div class="screen-inner">
      <div class="toolbar">
        <div class="search-field">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search-input" type="search" placeholder="Search files…" aria-label="Search files" />
        </div>
        <select id="category-filter" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
      </div>

      <div id="files-state" class="state-block" hidden></div>
      <div id="files-grid" class="files-grid" aria-live="polite"></div>
    </div>
  </section>

  <!-- ---- Admin screen ---- -->
  <section class="screen" id="screen-admin" hidden>
    <div class="screen-inner">

      <div class="admin-grid">

        <div class="panel">
          <div class="panel-head">
            <h2>Files</h2>
            <button id="btn-new-file" class="btn-primary btn-small" type="button">Add file</button>
          </div>
          <div id="admin-files-state" class="state-block" hidden></div>
          <ul id="admin-files-list" class="admin-list" aria-live="polite"></ul>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Categories</h2>
          </div>
          <form id="category-form" class="inline-form">
            <input id="new-category-name" type="text" placeholder="New category name" required />
            <button type="submit" class="btn-secondary btn-small">Add</button>
          </form>
          <ul id="admin-categories-list" class="admin-list admin-list--tight"></ul>
        </div>

      </div>
    </div>
  </section>

</div>

<!-- ============================ FILE EDIT MODAL =========================== -->
<div id="modal-file" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-file-title">
    <div class="modal-head">
      <h2 id="modal-file-title">Add file</h2>
      <button class="modal-close" id="modal-file-close" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="file-form" class="modal-body">
      <input type="hidden" id="ff-id" />
      <div class="field">
        <label for="ff-name">File name</label>
        <input id="ff-name" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="ff-category">Category</label>
          <select id="ff-category" required></select>
        </div>
        <div class="field">
          <label for="ff-source">Source</label>
          <select id="ff-source" required>
            <option value="mediafire">MediaFire</option>
            <option value="telegram">Telegram</option>
            <option value="other">Other (HTTPS)</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="ff-description">Description</label>
        <textarea id="ff-description" rows="2"></textarea>
      </div>
      <div class="field">
        <label for="ff-url">External URL</label>
        <input id="ff-url" type="url" required placeholder="https://…" />
      </div>
      <div class="field field-inline">
        <label for="ff-active"><input id="ff-active" type="checkbox" checked /> Active</label>
      </div>

      <fieldset class="field permissions-fieldset">
        <legend>Accessible users</legend>
        <div id="ff-permissions" class="permission-checks"></div>
      </fieldset>

      <div id="file-form-error" class="login-error" role="alert" hidden></div>

      <div class="modal-actions">
        <button type="button" id="ff-delete" class="btn-danger btn-small" hidden>Delete</button>
        <div class="modal-actions-right">
          <button type="button" class="btn-ghost btn-small" id="ff-cancel">Cancel</button>
          <button type="submit" class="btn-primary btn-small">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js" type="module"></script>
</body>
</html>
